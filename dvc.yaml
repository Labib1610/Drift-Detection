stages:
  streams:
    cmd: python src/streams.py
    deps:
    - data/interim
    - src/streams.py
    params:
    - seed
    - streams
    outs:
    - data/streams
  fertility:
    cmd: python src/fertility.py
    deps:
    - data/interim
    - data/streams
    - src/fertility.py
    params:
    - tokenizers
    - window
    outs:
    - features/fertility
    - features/windows
  prepare:
    cmd: python src/prepare.py --lang bn --params params.yaml
    deps:
    - data/raw/bn_potrika
    - src/prepare.py
    params:
    - bn
    - data
    - seed
    outs:
    - data/interim
  detect:
    cmd: python src/detect.py --params params.yaml
    deps:
    - features/windows
    - src/detect.py
    params:
    - detect
    - window
    outs:
    - results/calibration.json
    metrics:
    - results/detection_metrics.json:
        cache: false
  classify:
    cmd: python src/classifier.py --params params.yaml
    deps:
    - data/interim
    - features/windows
    - src/classifier.py
    params:
    - classifier
    outs:
    - features/classifier
  embed:
    cmd: python src/embeddings.py --params params.yaml
    deps:
    - data/interim
    - src/embeddings.py
    params:
    - embeddings
    outs:
    - features/embeddings
