stages:
  streams:
    cmd: python src/streams.py
    deps:
    - data/interim
    - src/streams.py
    params:
    - seed
    - streams
    outs:
    - data/streams
  fertility:
    cmd: python src/fertility.py
    deps:
    - data/interim
    - data/streams
    - src/fertility.py
    params:
    - tokenizers
    - window
    outs:
    - features/fertility
    - features/windows
  prepare:
    cmd: python src/prepare.py --lang bn --params params.yaml
    deps:
    - data/raw/bn_potrika
    - src/prepare.py
    params:
    - bn
    - data
    - seed
    outs:
    - data/interim
